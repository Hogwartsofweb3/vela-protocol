[package]
name = "vela_protocol"
version = "0.1.0"
description = "Vela Protocol - RWA Yield Aggregator"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vela_protocol"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }
mock_kamino = { path = "../mock_kamino", features = ["cpi"] }
mock_ondo = { path = "../mock_ondo", features = ["cpi"] }
spl-token-2022 = { version = "4", features = ["no-entrypoint"] }
spl-token-metadata-interface = { version = "0.5.1", default-features = false }
spl-type-length-value = { version = "0.5.0", default-features = false }

[dev-dependencies]
