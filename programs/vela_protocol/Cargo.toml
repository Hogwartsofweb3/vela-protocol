[package]
name = "vela_protocol"
version = "0.1.0"
description = "Vela Protocol - RWA Yield Aggregator"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vela_protocol"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.0"
anchor-spl = { version = "0.30.0", features = ["token", "token_2022", "associated_token"] }
